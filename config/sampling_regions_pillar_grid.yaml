# config/sampling_regions_pillar_grid.yaml
#
# Target sampling regions for scene_builder's pillar_grid.yaml. The two files are
# one design and must be changed together: the interior regions below are exactly
# the cells the 4 x 4 pillar grid leaves empty.
#
# HOW THE RUNNER READS THESE (src/vistsp_experiment_runner.cpp): a region is drawn
# uniformly - by REGION, not by volume, so a small region gets as many targets as a
# large one - then a centre uniformly inside it, then the radius is the shortest
# distance from that centre to the region's own bounds, capped by
# ~max_target_radius. A sphere that intersects a scene obstacle is rejected and
# redrawn, so a region buried inside an obstacle would silently never produce a
# target. None of the regions below is: the interior cells are free floor between
# pillars, and the perimeter ring is the strip of bare floor outside the wall.
#
# 33 regions:
#   * 8 PERIMETER, tiling the ring of floor between the wall's outer face (+-4.7)
#     and the floor edge (+-5.0), z 0 to 0.8 (the wall's height): 4 corner blocks
#     and 4 edge bands, meeting exactly, no gaps and no overlaps. They came out
#     0.3 m wide rather than the ~1 x 1 asked for because that strip IS 0.3 m
#     wide - a 10 x 10 floor around a 9 x 9 interior leaves 0.5 m per side, of
#     which the wall takes 0.2. Widening them means widening the strip: an 11 x 11
#     floor, or an 8 x 8 interior.
#     The robot can never drive out there (0.5 m base, 0.8 m wall), so these
#     targets are always observed from inside, over the wall.
#   * 25 INTERIOR, a 5 x 5 grid of 1.0 x 1.0 x 2.0 cells centred on
#     x, y in {-4, -2, 0, 2, 4}. With the 16 pillars at the odd coordinates these
#     complete the 9 x 9 interior: along either axis it reads region, pillar,
#     region, ... , region = 5 + 4 = 9 m. The cells where one coordinate is even
#     and the other odd are the corridors the base drives through, and are
#     deliberately not sampled from.

sampling_regions:

  # ---------------------------------------------------------------
  # PERIMETER - corners (0.3 x 0.3 x 0.8)
  # ---------------------------------------------------------------

  # NE corner
  - min: [4.70, 4.70, 0.0]
    max: [5.00, 5.00, 0.8]

  # NW corner
  - min: [-5.00, 4.70, 0.0]
    max: [-4.70, 5.00, 0.8]

  # SW corner
  - min: [-5.00, -5.00, 0.0]
    max: [-4.70, -4.70, 0.8]

  # SE corner
  - min: [4.70, -5.00, 0.0]
    max: [5.00, -4.70, 0.8]

  # ---------------------------------------------------------------
  # PERIMETER - edges (9.4 x 0.3 x 0.8), meeting the corner blocks
  # ---------------------------------------------------------------

  # North edge
  - min: [-4.70, 4.70, 0.0]
    max: [4.70, 5.00, 0.8]

  # South edge
  - min: [-4.70, -5.00, 0.0]
    max: [4.70, -4.70, 0.8]

  # East edge
  - min: [4.70, -4.70, 0.0]
    max: [5.00, 4.70, 0.8]

  # West edge
  - min: [-5.00, -4.70, 0.0]
    max: [-4.70, 4.70, 0.8]

  # ---------------------------------------------------------------
  # INTERIOR - 5 x 5 grid of 1.0 x 1.0 x 2.0 cells, between the pillars
  # ---------------------------------------------------------------

  # cell (1, 1), centre [-4.0, -4.0]
  - min: [-4.5, -4.5, 0.0]
    max: [-3.5, -3.5, 2.0]

  # cell (1, 2), centre [-4.0, -2.0]
  - min: [-4.5, -2.5, 0.0]
    max: [-3.5, -1.5, 2.0]

  # cell (1, 3), centre [-4.0, 0.0]
  - min: [-4.5, -0.5, 0.0]
    max: [-3.5, 0.5, 2.0]

  # cell (1, 4), centre [-4.0, 2.0]
  - min: [-4.5, 1.5, 0.0]
    max: [-3.5, 2.5, 2.0]

  # cell (1, 5), centre [-4.0, 4.0]
  - min: [-4.5, 3.5, 0.0]
    max: [-3.5, 4.5, 2.0]

  # cell (2, 1), centre [-2.0, -4.0]
  - min: [-2.5, -4.5, 0.0]
    max: [-1.5, -3.5, 2.0]

  # cell (2, 2), centre [-2.0, -2.0]
  - min: [-2.5, -2.5, 0.0]
    max: [-1.5, -1.5, 2.0]

  # cell (2, 3), centre [-2.0, 0.0]
  - min: [-2.5, -0.5, 0.0]
    max: [-1.5, 0.5, 2.0]

  # cell (2, 4), centre [-2.0, 2.0]
  - min: [-2.5, 1.5, 0.0]
    max: [-1.5, 2.5, 2.0]

  # cell (2, 5), centre [-2.0, 4.0]
  - min: [-2.5, 3.5, 0.0]
    max: [-1.5, 4.5, 2.0]

  # cell (3, 1), centre [0.0, -4.0]
  - min: [-0.5, -4.5, 0.0]
    max: [0.5, -3.5, 2.0]

  # cell (3, 2), centre [0.0, -2.0]
  - min: [-0.5, -2.5, 0.0]
    max: [0.5, -1.5, 2.0]

  # cell (3, 3), centre [0.0, 0.0]
  - min: [-0.5, -0.5, 0.0]
    max: [0.5, 0.5, 2.0]

  # cell (3, 4), centre [0.0, 2.0]
  - min: [-0.5, 1.5, 0.0]
    max: [0.5, 2.5, 2.0]

  # cell (3, 5), centre [0.0, 4.0]
  - min: [-0.5, 3.5, 0.0]
    max: [0.5, 4.5, 2.0]

  # cell (4, 1), centre [2.0, -4.0]
  - min: [1.5, -4.5, 0.0]
    max: [2.5, -3.5, 2.0]

  # cell (4, 2), centre [2.0, -2.0]
  - min: [1.5, -2.5, 0.0]
    max: [2.5, -1.5, 2.0]

  # cell (4, 3), centre [2.0, 0.0]
  - min: [1.5, -0.5, 0.0]
    max: [2.5, 0.5, 2.0]

  # cell (4, 4), centre [2.0, 2.0]
  - min: [1.5, 1.5, 0.0]
    max: [2.5, 2.5, 2.0]

  # cell (4, 5), centre [2.0, 4.0]
  - min: [1.5, 3.5, 0.0]
    max: [2.5, 4.5, 2.0]

  # cell (5, 1), centre [4.0, -4.0]
  - min: [3.5, -4.5, 0.0]
    max: [4.5, -3.5, 2.0]

  # cell (5, 2), centre [4.0, -2.0]
  - min: [3.5, -2.5, 0.0]
    max: [4.5, -1.5, 2.0]

  # cell (5, 3), centre [4.0, 0.0]
  - min: [3.5, -0.5, 0.0]
    max: [4.5, 0.5, 2.0]

  # cell (5, 4), centre [4.0, 2.0]
  - min: [3.5, 1.5, 0.0]
    max: [4.5, 2.5, 2.0]

  # cell (5, 5), centre [4.0, 4.0]
  - min: [3.5, 3.5, 0.0]
    max: [4.5, 4.5, 2.0]
