planner:
  mode: "VisRRT" # "VisRRT" or "VisPRM"
  # Snap a vertex being added, whose position sees the target, into one that looks at
  # it. This is the VisualIK variant of VisRRT.
  snap_fov_on_insert: true
  # The same while scanning vertices the roadmap already held (VisPRM coverage queries
  # only). Expensive on a large persistent roadmap, so off unless asked for.
  snap_fov_on_scan: false
  use_visibility_integrity: false
  use_visibility_roadmap: false
  time_cap: 120 #seconds

  # Planning Group & Links
  # group_name: "manipulator"
  group_name: "whole_robot"
  # ee_link_name: "ur_arm_tool0"
  # ee_link_name: "tool0"
  # ee_link_name: "flashlight"
  ee_link_name: "light_beam"

  # # General Settings
  resolution: 0.01
  visibility_threshold: 0.75
  workspace_bounds:
    x_min: -5.0
    x_max: 5.0
    y_min: -5.0
    y_max: 5.0
    z_min: 0.0
    z_max: 2.5

  # Visibility tool Parameters
  visibility_tool_params:
    beam_length: 3.0
    beam_angle: 0.26

  # Post-Processing
  enable_shortcutting: true

  # RRT Specific Parameters
  rrt:
    goal_bias: 0.125
    max_extension: 3.0
    max_iterations: 100000

  # # PRM Specific Parameters
  prm:
    num_neighbors: 10
    num_samples: 50
    max_goals: 10
    # 0 = LINEAR, 1 = BINARY_SEARCH
    edge_validation_method: 1
    max_size: 500000

  visibility_integrity_params:
    num_samples: 1200
    num_roadmap_samples: 20000
    vi_threshold: 0.7
    k_neighbors: 7
    limit_diameter_factor: 1000.0
