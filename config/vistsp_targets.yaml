# Targets for a VisTSP tour (global_plan step 4), read by
# visual_planning_tour_client. Three shapes are accepted; the client checks
# them in this order and uses the first one present.
#
# A point cloud and a target sphere are not alternatives -- the sphere is
# DERIVED from the cloud by enclosingBall() (common/Types.h), which is the same
# function VisibilityPlannerBase::computeTargetMES() uses. The service itself
# carries spheres only, so this conversion happens once, here at the input.

# --- shape 1: spheres, stated directly --------------------------------------
targets:
  - center: [0.195, -1.13, 0.84]
    radius: 0.05
  - center: [0.65, -0.80, 0.84]
    radius: 0.05
  - center: [-0.19, -0.65, 0.855]
    radius: 0.05

# --- shape 2: one point cloud PER TARGET ------------------------------------
# Each inner list becomes one sphere. Use this when the targets come from
# segmented sensor data rather than being measured by hand.
#
# target_clouds:
#   - [[0.195, -1.13, 0.79], [0.195, -1.13, 0.89]]
#   - [[0.65, -0.83, 0.84], [0.65, -0.77, 0.84]]
#   - [[-0.22, -0.65, 0.855], [-0.16, -0.65, 0.855]]

# --- shape 3: the legacy single-target cloud --------------------------------
# config/targets.yaml uses this. The whole list collapses into ONE sphere, so a
# tour over it has a single stop; the client warns when it takes this path.
#
# target_points:
#   - [0.195, -1.13, 0.79]
#   - [0.195, -1.13, 0.89]
